<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>감아차기 프리킥 · 60초</title>
<style>
:root{
  --lime:#c6ff45;
  --cyan:#63f1ff;
  --ink:#05070e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;overflow:hidden;background:var(--ink);color:#fff;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
#app{position:fixed;inset:0;overflow:hidden}
#game{position:absolute;inset:0;display:block;touch-action:none;width:100%;height:100%}

/* ---------- HUD ---------- */
#hud{
  position:absolute;inset:0;pointer-events:none;
  padding:calc(10px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 0 calc(14px + env(safe-area-inset-left,0px));
  display:flex;justify-content:space-between;align-items:flex-start;gap:6px;
}
.hud-left{min-width:78px}
.time-row{display:flex;align-items:baseline;gap:3px;line-height:1}
#timeVal{
  display:inline-block;min-width:1.6em;font-size:clamp(26px,7.6vw,40px);font-weight:900;letter-spacing:-1px;
  text-shadow:0 0 18px rgba(198,255,69,.45);transition:color .2s;
}
#timeVal.low{color:#ff6b6b;text-shadow:0 0 20px rgba(255,80,80,.65)}
.time-unit{font-size:12px;font-weight:700;color:#9fb0c8}
.bar{margin-top:6px;width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.13);overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:3px;background:linear-gradient(90deg,#c6ff45,#63f1ff)}
#windTag{margin-top:7px;font-size:11px;font-weight:800;color:#8fa6c4;opacity:0;transition:opacity .3s;white-space:nowrap;letter-spacing:.3px}
#windTag.on{opacity:1}
.score-block{text-align:center;flex:1;padding-top:2px}
#scoreVal{
  font-size:clamp(30px,9vw,54px);font-weight:900;letter-spacing:-1.5px;line-height:1;
  text-shadow:0 0 22px rgba(99,241,255,.42);font-variant-numeric:tabular-nums;
}
.combo{
  margin-top:6px;font-size:clamp(12px,3.4vw,16px);font-weight:900;height:20px;letter-spacing:.5px;
  color:#ffd34d;opacity:0;transform:scale(.8);transition:opacity .15s,transform .15s;white-space:nowrap;
}
.combo.on{opacity:1;transform:scale(1)}
.combo.fire{color:#ff8a3d;text-shadow:0 0 16px rgba(255,110,40,.9)}
#muteBtn{
  pointer-events:auto;width:42px;height:42px;flex:0 0 auto;border-radius:14px;
  border:1px solid rgba(255,255,255,.14);background:rgba(12,20,36,.6);color:#dbe7ff;
  font-size:19px;line-height:1;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
#muteBtn:active{transform:scale(.94)}
#hud.dim .hud-left,#hud.dim .score-block{opacity:0;transition:opacity .25s}
.hud-left,.score-block{transition:opacity .25s}

/* ---------- overlays ---------- */
.screen{
  position:absolute;inset:0;display:block;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  background:radial-gradient(120% 80% at 50% 0%,rgba(12,26,48,.70),rgba(3,5,10,.94));
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);text-align:center;
}
.screen.hidden{display:none}
.screen-inner{
  min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:calc(22px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px));
}
.ball-badge{font-size:clamp(38px,12vw,60px);line-height:1;filter:drop-shadow(0 0 22px rgba(198,255,69,.55))}
h1{font-size:clamp(28px,9vw,46px);font-weight:900;letter-spacing:-1.5px;line-height:1.05}
h1 span{color:var(--lime)}
.sub{font-size:clamp(12px,3.6vw,15px);font-weight:700;color:#9fb4d0;letter-spacing:.4px}
.tips{display:flex;flex-direction:column;gap:7px;margin:6px 0 4px;width:min(340px,86vw)}
.tip{
  display:flex;align-items:center;gap:9px;text-align:left;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;
  padding:9px 12px;font-size:clamp(11px,3.2vw,13px);color:#b9c8dc;
}
.tip b{flex:0 0 auto;color:var(--lime);font-size:clamp(11px,3.2vw,13px);min-width:62px}
.cta{
  margin-top:6px;pointer-events:auto;border:0;cursor:pointer;
  padding:15px 44px;border-radius:999px;font-size:clamp(16px,4.6vw,19px);font-weight:900;letter-spacing:.5px;
  color:#08130a;background:linear-gradient(180deg,#dcff70,#a8e832);
  box-shadow:0 10px 26px rgba(166,232,50,.32),0 0 0 1px rgba(255,255,255,.25) inset;
  transition:transform .12s;
}
.cta:active{transform:scale(.96)}
.best{margin-top:8px;font-size:12px;color:#8fa3bd;font-weight:700;letter-spacing:.3px}
.best b{color:var(--cyan);font-weight:900}

.grade-label{font-size:11px;letter-spacing:4px;font-weight:800;color:#8fa3bd}
.grade{
  font-size:clamp(58px,20vw,96px);font-weight:900;line-height:.95;letter-spacing:-3px;
  background:linear-gradient(180deg,#eaffb0,#8fdcff 70%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px rgba(150,230,255,.35));
}
.final{font-size:clamp(15px,4.4vw,19px);font-weight:800;color:#c8d7ea}
.final b{font-size:clamp(28px,8vw,38px);color:#fff;font-weight:900;letter-spacing:-1px}
.newbest{
  font-size:12px;font-weight:900;letter-spacing:2px;color:#08130a;background:var(--lime);
  padding:4px 12px;border-radius:999px;box-shadow:0 0 18px rgba(198,255,69,.5);
}
.newbest.hidden{display:none}
.stats{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;width:min(340px,88vw);margin-top:6px;
}
.stat{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 10px;text-align:left}
.stat span{display:block;font-size:10px;font-weight:800;letter-spacing:.6px;color:#8fa3bd}
.stat b{font-size:clamp(15px,4.4vw,18px);font-weight:900;color:#fff}
.badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:min(360px,90vw);margin-top:4px}
.badge{
  font-size:clamp(10px,3vw,12px);font-weight:800;padding:6px 11px;border-radius:999px;
  background:rgba(198,255,69,.12);border:1px solid rgba(198,255,69,.42);color:#ddffa0;
}
.badge.none{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1);color:#7c8ea6}

/* ---------- player id ---------- */
.nick-row{display:flex;flex-direction:column;align-items:center;gap:5px;width:min(340px,88vw);margin-top:2px}
.nick-label{font-size:9.5px;font-weight:900;letter-spacing:2.5px;color:#8fa3bd}
.nick-field{position:relative;width:100%}
#nickInput{
  width:100%;padding:13px 52px 13px 16px;border-radius:14px;border:1px solid rgba(198,255,69,.45);
  background:rgba(8,16,26,.78);color:#fff;font-family:inherit;font-size:16px;font-weight:800;
  text-align:center;letter-spacing:.5px;outline:none;
  -webkit-user-select:text;user-select:text;touch-action:manipulation;
}
#nickInput::placeholder{color:#5d6f88;font-weight:700;letter-spacing:0}
#nickInput:focus{border-color:var(--lime);box-shadow:0 0 0 3px rgba(198,255,69,.16)}
.nick-count{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:800;color:#6d7f99;font-variant-numeric:tabular-nums}

/* ---------- ranking board ---------- */
.rank-panel{
  width:min(380px,94vw);margin-top:8px;padding:10px 10px 8px;text-align:left;
  background:rgba(8,14,24,.74);border:1px solid rgba(255,255,255,.1);border-radius:16px;
}
.rank-head{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900;color:#dbe7ff}
.rank-head .grow{flex:1 1 auto;min-width:4px}
.rank-state{font-size:9.5px;font-weight:800;letter-spacing:.2px;color:#7fd4ff;white-space:nowrap}
.rank-state.local{color:#ffcf6b}
.rank-state.busy{color:#9fb4d0}
.rank-refresh{border:0;background:none;color:#93a7c0;font-family:inherit;font-size:15px;line-height:1;cursor:pointer;padding:2px 3px;border-radius:8px}
.rank-refresh:active{transform:scale(.9);color:#c6ff45}
.rank-cols,.rank-row{display:grid;grid-template-columns:24px minmax(0,1fr) 54px 40px 30px;gap:5px;align-items:center}
.rank-cols{margin:7px 0 2px;padding:0 4px;font-size:9px;font-weight:800;letter-spacing:.3px;color:#7285a0}
.rank-cols i{font-style:normal;text-align:right}
.rank-rows{max-height:212px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rank-row{padding:5px 4px;border-radius:9px;font-size:12px;font-weight:800;color:#dce8f8}
.rank-row+.rank-row{margin-top:1px}
.rank-row .pos{color:#8fa3bd;font-variant-numeric:tabular-nums}
.rank-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-row .sc{text-align:right;color:#eaffb0;font-variant-numeric:tabular-nums}
.rank-row .gl{text-align:right;color:#9fb4d0;font-variant-numeric:tabular-nums;font-size:11.5px}
.rank-row .gr{text-align:right;color:#63f1ff;font-size:11.5px}
.rank-row.me{background:rgba(198,255,69,.15);box-shadow:inset 0 0 0 1px rgba(198,255,69,.5)}
.rank-row.me .nm{color:#f4ffdd}
.rank-row.top .pos{color:#ffd34d}
.rank-gap{padding:2px 4px;font-size:10px;font-weight:800;color:#5d6f88;letter-spacing:2px;text-align:center}
.rank-empty{padding:12px 4px 10px;font-size:11px;line-height:1.5;font-weight:700;color:#7c8ea6}
.rank-foot{margin-top:6px;font-size:9.5px;font-weight:700;line-height:1.4;color:#6d7f99;letter-spacing:.2px}

/* ---------- end screen extras ---------- */
.myrank{display:flex;align-items:baseline;justify-content:center;gap:6px;font-size:12px;font-weight:800;color:#9fb4d0;margin-top:1px}
.myrank.hidden{display:none}
.myrank b{font-size:17px;font-weight:900;color:var(--lime);letter-spacing:-.5px}
.myrank .sub2{font-size:10.5px;font-weight:800;color:#7c8ea6}
.endbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:2px}
.ghost{
  pointer-events:auto;cursor:pointer;font-family:inherit;font-size:12px;font-weight:800;
  padding:10px 15px;border-radius:999px;color:#dbe7ff;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);
}
.ghost:active{transform:scale(.96)}
.challenge{
  width:min(360px,92vw);padding:9px 12px;border-radius:14px;text-align:center;
  font-size:11.5px;font-weight:800;line-height:1.45;color:#c9f6ff;
  background:linear-gradient(180deg,rgba(99,241,255,.18),rgba(99,241,255,.05));
  border:1px solid rgba(99,241,255,.42);
}
.challenge.hidden{display:none}
.challenge b{color:#fff}
.challenge .vs{display:block;font-size:9.5px;letter-spacing:2px;color:#7fd4ff;margin-bottom:2px}
.toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:60;
  transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;
  padding:10px 18px;border-radius:999px;font-size:12px;font-weight:800;color:#eaffb0;
  background:rgba(10,20,32,.96);border:1px solid rgba(198,255,69,.5);
  box-shadow:0 10px 30px rgba(0,0,0,.45);transition:opacity .18s,transform .18s;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>


  <div id="startScreen" class="screen">
   <div class="screen-inner">
    <div class="ball-badge">⚽</div>
    <h1>감아차기 <span>프리킥</span></h1>
    <div class="sub">60초 타임어택 · 1분 승부차기</div>
    <div id="challenge" class="challenge hidden"></div>
    <div class="nick-row nodismiss">
      <div class="nick-label">PLAYER ID</div>
      <div class="nick-field">
        <input id="nickInput" type="text" maxlength="12" placeholder="아이디(닉네임)" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="플레이어 아이디(닉네임)">
        <span class="nick-count" id="nickCount">0/12</span>
      </div>
    </div>
    <div class="tips">
      <div class="tip"><b>드래그</b><span>공에서 골대 쪽으로 밀듯이 휘두르세요</span></div>
      <div class="tip"><b>감아차기</b><span>드래그 선을 활처럼 휘면 공이 크게 감깁니다</span></div>
      <div class="tip"><b>황금 타겟</b><span>명중하면 +5초 &amp; 점수 2배</span></div>
    </div>
    <button id="startBtn" class="cta nodismiss">킥오프</button>
    <div class="best">최고 기록 <b id="bestStart">0</b>점</div>
    <div id="rankStart" class="rank-panel nodismiss"></div>
   </div>
  </div>

  <div id="endScreen" class="screen hidden">
   <div class="screen-inner">
    <div class="grade-label">FULL TIME</div>
    <div id="grade" class="grade">A</div>
    <div class="final"><b id="finalScore">0</b>점</div>
    <div id="myRank" class="myrank hidden"></div>
    <div id="newBest" class="newbest hidden">NEW BEST!</div>
    <div id="statsGrid" class="stats"></div>
    <div id="badges" class="badges"></div>
    <button id="retryBtn" class="cta nodismiss">다시 하기</button>
    <div class="endbtns nodismiss">
      <button id="shareBtn" class="ghost" type="button">📤 도전장 링크 복사</button>
      <button id="rankOpenBtn" class="ghost" type="button">🏆 랭킹 새로고침</button>
    </div>
    <div id="rankEnd" class="rank-panel nodismiss"></div>
   </div>
  </div>

  <div id="hud">
    <div class="hud-left">
      <div class="time-row"><span id="timeVal">60</span><span class="time-unit">초</span></div>
      <div class="bar"><i id="timeBar"></i></div>
      <div id="windTag">바람</div>
    </div>
    <div class="score-block">
      <div id="scoreVal">0</div>
      <div id="comboTag" class="combo"></div>
    </div>
    <button id="muteBtn" aria-label="소리 켜기/끄기">🔊</button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function () {
'use strict';

/* ============================================================
   0. helpers
   ============================================================ */
var TAU = Math.PI * 2;
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function rand(a, b) { return a + Math.random() * (b - a); }
function randi(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function dist2(x1, y1, x2, y2) { var dx = x2 - x1, dy = y2 - y1; return Math.sqrt(dx * dx + dy * dy); }
function store(key, val) {
  try { window.localStorage.setItem(key, String(val)); } catch (e) { /* ignore */ }
}
function load(key, dflt) {
  try {
    var v = window.localStorage.getItem(key);
    return v === null ? dflt : v;
  } catch (e) { return dflt; }
}

/* ============================================================
   1. dom
   ============================================================ */
var $ = function (id) { return document.getElementById(id); };
var canvas = $('game');
var ctx = canvas.getContext('2d');
var el = {
  hud: $('hud'),
  time: $('timeVal'),
  bar: $('timeBar'),
  score: $('scoreVal'),
  combo: $('comboTag'),
  mute: $('muteBtn'),
  wind: $('windTag'),
  start: $('startScreen'),
  end: $('endScreen'),
  bestStart: $('bestStart'),
  finalScore: $('finalScore'),
  grade: $('grade'),
  stats: $('statsGrid'),
  badges: $('badges'),
  newBest: $('newBest'),
  startBtn: $('startBtn'),
  retryBtn: $('retryBtn'),
  nick: $('nickInput'),
  nickCount: $('nickCount'),
  rankStart: $('rankStart'),
  rankEnd: $('rankEnd'),
  myRank: $('myRank'),
  challenge: $('challenge'),
  shareBtn: $('shareBtn'),
  rankOpenBtn: $('rankOpenBtn'),
  toast: $('toast')
};

/* ============================================================
   2. sound  (Web Audio API, generated on the fly)
   ============================================================ */
var Sound = {
  actx: null,
  master: null,
  muted: false,
  noiseBuf: null,

  init: function () {
    if (this.actx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.actx = new AC(); } catch (e) { this.actx = null; return; }
    this.master = this.actx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.85;
    this.master.connect(this.actx.destination);
    var len = Math.floor(this.actx.sampleRate * 1.2);
    var buf = this.actx.createBuffer(1, len, this.actx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = buf;
  },

  resume: function () {
    if (this.actx && this.actx.state === 'suspended') {
      try { this.actx.resume(); } catch (e) { /* ignore */ }
    }
  },

  setMuted: function (m) {
    this.muted = !!m;
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.85;
  },

  ok: function () { return this.actx && !this.muted; },

  tone: function (type, f0, f1, t0, dur, vol, dest) {
    var c = this.actx;
    var o = c.createOscillator();
    var g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + Math.min(0.012, dur * 0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(dest || this.master);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  },

  noise: function (t0, dur, vol, freq, q, type, sweepTo) {
    var c = this.actx;
    var s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    s.loop = true;
    var bp = c.createBiquadFilter();
    bp.type = type || 'bandpass';
    bp.frequency.setValueAtTime(freq, t0);
    if (sweepTo) bp.frequency.exponentialRampToValueAtTime(Math.max(60, sweepTo), t0 + dur);
    bp.Q.value = q || 1;
    var g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(bp); bp.connect(g); g.connect(this.master);
    s.start(t0);
    s.stop(t0 + dur + 0.05);
  },

  kick: function (power) {
    if (!this.ok()) return;
    var t = this.actx.currentTime;
    this.tone('sine', 160 + power * 70, 42, t, 0.20, 0.85);
    this.noise(t, 0.09, 0.45, 2300, 1.1, 'bandpass', 900);
    this.tone('triangle', 320, 120, t + 0.005, 0.08, 0.18);
  },

  post: function () {
    if (!this.ok()) return;
    var t = this.actx.currentTime;
    this.tone('triangle', 1180, 1120, t, 0.55, 0.42);
    this.tone('triangle', 1760, 1720, t, 0.45, 0.30);
    this.tone('sine', 2400, 2300, t, 0.30, 0.16);
    this.noise(t, 0.06, 0.22, 3200, 3, 'bandpass', 2000);
  },

  net: function () {
    if (!this.ok()) return;
    var t = this.actx.currentTime;
    this.noise(t, 0.26, 0.30, 1800, 0.8, 'bandpass', 420);
  },

  cheer: function (big) {
    if (!this.ok()) return;
    var t = this.actx.currentTime;
    var vol = big ? 0.42 : 0.26;
    this.noise(t, 1.15, vol, 620, 0.5, 'lowpass', 1300);
    this.noise(t + 0.05, 0.85, vol * 0.55, 2400, 0.9, 'bandpass', 1500);
    this.tone('sine', 600, 900, t + 0.02, 0.12, 0.05);
  },

  save: function () {
    if (!this.ok()) return;
    var t = this.actx.currentTime;
    this.tone('sine', 220, 90, t, 0.22, 0.36);
    this.noise(t, 0.35, 0.18, 900, 0.6, 'lowpass', 300);
  },

  whistle: function () {
    if (!this.ok()) return;
    var t = this.actx.currentTime;
    this.tone('sine', 2050, 2150, t, 0.30, 0.14);
    this.tone('sine', 2080, 1980, t + 0.02, 0.24, 0.09);
  },

  golden: function () {
    if (!this.ok()) return;
    var t = this.actx.currentTime;
    this.tone('triangle', 660, 660, t, 0.16, 0.26);
    this.tone('triangle', 880, 880, t + 0.08, 0.16, 0.24);
    this.tone('triangle', 1320, 1320, t + 0.16, 0.30, 0.22);
  },

  tick: function () {
    if (!this.ok()) return;
    var t = this.actx.currentTime;
    this.tone('sine', 980, 980, t, 0.07, 0.16);
  }
};

/* ============================================================
   3. world constants + camera
   ============================================================ */
var GOAL_HW = 3.66;      // half width of the goal mouth (m)
var GOAL_H = 2.44;       // crossbar height (m)
var GRAV = 9.8;
var WALL_Z = 9.15;       // wall distance from goal line (m)

var W = 390, H = 844, DPR = 1;

var cam = {
  focal: 1000,
  cx: 195,
  horizon: 150,
  camH: 3.4,
  back: 7,      // camera distance behind the ball (m)
  camX: 0       // lateral camera offset
};

var G = {
  state: 'menu',        // menu | aim | flight | result | over
  nick: '',
  time: 60,
  score: 0,
  best: 0,
  combo: 0,
  maxCombo: 0,
  shots: 0,
  goals: 0,
  wonder: 0,
  goldenHits: 0,
  banana: 0,
  clutch: false,
  D: 19,
  startX: 0,
  resultTimer: 0,
  shake: 0,
  netSway: 0,
  flash: 0,
  timeUp: false,
  t: 0,
  lastTickSec: 99,
};

var ball = {
  x: 0, y: 0.11, z: 19,
  vx: 0, vy: 0, vz: 0,
  live: false,
  rot: 0,
  spin: 0,
  curve: 0,
  trail: [],
  cross: null
};

var keeper = {
  x: 0, targetX: 0, dive: 0, dir: 0, t: 0, react: 0,
  active: false, reach: 0.82, speed: 6.5
};

var wall = [];
var gold = { active: false, x: 0, y: 0, life: 0, wait: 4, pulse: 0 };
var wind = { accel: 0 };
var particles = [];
var popups = [];

/* ------------------------------------------------------------
   projection
   ------------------------------------------------------------ */
function depthOf(z) { return G.D + cam.back - z; }

function proj(x, y, z) {
  var d = depthOf(z);
  if (d < 0.4) d = 0.4;
  var s = cam.focal / d;
  return {
    x: cam.cx + (x - cam.camX) * s,
    y: cam.horizon + (cam.camH - y) * s,
    s: s,
    d: d
  };
}

function groundAt(z) { return proj(0, 0, z).y; }

function screenToGoalPlane(sx, sy) {
  var s = cam.focal / (G.D + cam.back);
  return {
    x: (sx - cam.cx) / s + cam.camX,
    y: cam.camH - (sy - cam.horizon) / s,
    s: s
  };
}

/* ------------------------------------------------------------
   resize / camera fit
   ------------------------------------------------------------ */
function viewportSize() {
  var w = window.innerWidth, h = window.innerHeight;
  if (!w || !h) {
    var vv = window.visualViewport;
    w = (vv && vv.width) || 390;
    h = (vv && vv.height) || 844;
  }
  return { w: Math.max(240, w), h: Math.max(360, h) };
}

function resize() {
  var vs = viewportSize();
  W = vs.w;
  H = vs.h;
  DPR = Math.min(window.devicePixelRatio || 1, 2.25);

  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  if (ctx.setTransform) ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  cam.cx = W / 2;
  // goal mouth width on screen ~ 76% of the shorter viewport axis
  var base = Math.min(W, H * 0.95);
  cam.focal = base * 0.76 * 25 / 7.32;   // tuned so a 25 m deep goal is `base*0.76` wide
  cam.horizon = H * 0.18;
  cam.camH = (H * 0.76 - cam.horizon) * cam.back / cam.focal;  // ball sits at 76% viewport height

  skyGrad = null;
  grassGrad = null;
  buildCrowd();
}

/* ============================================================
   4. scene setup
   ============================================================ */
function buildWall(bx, D) {
  wall.length = 0;
  var count = G.wallCount || 2;
  var side = (Math.random() < 0.5 ? -1 : 1);
  var mid = bx * (WALL_Z / D) + side * 1.45;
  var shirts = ['#e6ecff', '#ff6b7a', '#8fd0ff', '#ffd166'];
  for (var i = 0; i < count; i++) {
    wall.push({
      x: mid + (i - (count - 1) / 2) * 0.64,
      jumpT: 0,
      top: 1.78,
      shirt: shirts[i % shirts.length]
    });
  }
  return side;
}

function resetKeeper() {
  keeper.x = 0;
  keeper.targetX = 0;
  keeper.dive = 0;
  keeper.dir = 0;
  keeper.t = 0;
  keeper.react = 0.2;
  keeper.active = false;
}

function placeBall(x, D) {
  ball.x = x;
  ball.y = 0.11;
  ball.z = D;
  ball.vx = ball.vy = ball.vz = 0;
  ball.live = false;
  ball.rot = 0;
  ball.spin = 0;
  ball.curve = 0;
  ball.trail.length = 0;
  ball.cross = null;
  G.D = D;
  G.startX = x;
}

function nextShot() {
  G.state = 'aim';
  G.shots++;
  G.timeUp = false;

  var prog = clamp(G.goals / 14, 0, 1);
  G.wallCount = clamp(1 + Math.floor(G.goals / 3), 1, 4);

  var D = rand(16.5, 18.5 + prog * 4.5);
  var x;
  if (Math.random() < 0.42) x = 0;
  else x = (Math.random() < 0.5 ? -1 : 1) * rand(1.0, 1.7 + prog * 0.4);
  x = clamp(x, -2.05, 2.05);

  placeBall(x, D);
  buildWall(x, D);
  resetKeeper();
  keeper.x = 0;

  if (G.goals >= 3 && Math.random() < 0.55) {
    wind.accel = (Math.random() < 0.5 ? -1 : 1) * rand(0.8, 2.3);
  } else {
    wind.accel = 0;
  }

  if (gold.active) { /* keep running */ } else if (G.goals >= 1) { gold.wait = rand(3, 6); }
}

/* ============================================================
   5. shot maths
   ============================================================ */
function computeShot(dx, dy, bend) {
  var bp = proj(ball.x, ball.y, ball.z);
  var K = 1.8;                       // drag -> screen-space aim gain
  var ax = bp.x + dx * K;
  var ay = bp.y + dy * K;

  var sGoal = cam.focal / (G.D + cam.back);
  var tx = (ax - cam.cx) / sGoal + cam.camX;
  var ty = cam.camH - (ay - cam.horizon) / sGoal;
  ty = clamp(ty, 0.06, 7.2);

  var len = Math.sqrt(dx * dx + dy * dy);
  var power = clamp((len - H * 0.05) / (H * 0.24), 0.12, 1);
  var speed = 17 + power * 17;

  var dist = Math.sqrt((tx - ball.x) * (tx - ball.x) + ty * ty + G.D * G.D);
  var T = clamp(dist / speed, 0.32, 1.35);

  var acc = bend * 10.5;
  var vx = (tx - ball.x - 0.5 * acc * T * T) / T;
  var vy = (ty - ball.y + 0.5 * GRAV * T * T) / T;
  var vz = -G.D / T;

  return {
    vx: vx, vy: vy, vz: vz, T: T, acc: acc,
    tx: tx, ty: ty, power: power, speed: speed, bend: bend
  };
}

function previewPoints(shot) {
  var pts = [];
  var steps = 22;
  var a = shot.acc + wind.accel;
  for (var i = 0; i <= steps; i++) {
    var t = shot.T * 0.60 * (i / steps);
    var x = ball.x + shot.vx * t + 0.5 * a * t * t;
    var y = ball.y + shot.vy * t - 0.5 * GRAV * t * t;
    var z = ball.z + shot.vz * t;
    pts.push(proj(x, Math.max(y, 0.02), z));
  }
  return pts;
}

function beginShot(dx, dy, bend) {
  var shot = computeShot(dx, dy, bend);
  ball.vx = shot.vx;
  ball.vy = shot.vy;
  ball.vz = shot.vz;
  ball.curve = shot.acc;
  ball.spin = bend;
  ball.live = true;
  ball.trail.length = 0;
  G.state = 'flight';

  wall.forEach(function (d) { d.jumpT = 0; });

  keeper.active = true;
  keeper.t = 0;
  keeper.dive = 0;
  var prog = clamp(G.goals / 26, 0, 1);
  var err = lerp(2.9, 1.15, prog);
  keeper.targetX = clamp(shot.tx + rand(-err, err), -3.1, 3.1);
  keeper.react = rand(0.12, 0.30) * lerp(1.15, 0.5, prog);
  keeper.speed = lerp(2.8, 5.9, prog);

  Sound.init();
  Sound.resume();
  Sound.kick(shot.power);
}

/* ============================================================
   6. resolution
   ============================================================ */
function addPopup(text, x, y, color, size) {
  popups.push({ text: text, x: x, y: y, color: color, size: size || 34, life: 1.25, max: 1.25, vy: -42 });
}

function burst(x, y, n, colors) {
  for (var i = 0; i < n; i++) {
    var a = rand(0, TAU);
    var sp = rand(60, 430);
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 60,
      life: rand(0.35, 0.95),
      max: 1,
      r: rand(1.6, 4.6),
      c: pick(colors)
    });
  }
}

function resolveShot(px, py, pz) {
  var denom = (pz - ball.z);
  var t = denom !== 0 ? pz / denom : 1;
  t = clamp(t, 0, 1);
  var cx = lerp(px, ball.x, t);
  var cy = lerp(py, ball.y, t);

  ball.x = cx;
  ball.y = cy;
  ball.z = 0;
  ball.live = false;
  ball.cross = { x: cx, y: cy };

  var nearPost = Math.abs(Math.abs(cx) - GOAL_HW) < 0.13 && cy < GOAL_H + 0.15;
  var nearBar = Math.abs(cy - GOAL_H) < 0.13 && Math.abs(cx) < GOAL_HW + 0.15;
  var inGoal = Math.abs(cx) < GOAL_HW - 0.04 && cy < GOAL_H - 0.04 && cy > -0.15;

  // golden zone hit test (inside the mouth)
  var goldHit = gold.active && inGoal &&
    dist2(cx, cy, gold.x, gold.y) < 0.62;

  var saved = false;
  if (inGoal) {
    // a diving keeper covers the low corners far better than the top corner
    var hFactor = cy < 1.15 ? 1 : (cy < 1.90 ? 0.82 : 0.55);
    var reach = (keeper.reach + keeper.dive * 0.30) * hFactor;
    saved = Math.abs(cx - keeper.x) < reach && cy < 2.34;
  }

  if (nearBar || nearPost) {
    resolveMiss('post', cx, cy);
  } else if (inGoal) {
    if (saved) resolveMiss('save', cx, cy);
    else resolveGoal(cx, cy, goldHit);
  } else {
    resolveMiss(cy >= GOAL_H ? 'over' : 'wide', cx, cy);
  }
}

function resolveGoal(cx, cy, goldHit) {
  var topCorner = Math.abs(cx) > 2.35 && cy > 1.5;
  var sideNet = Math.abs(cx) > 3.0 && cy < 0.95;
  var wonder = topCorner || sideNet;

  G.goals++;
  G.combo++;
  if (G.combo > G.maxCombo) G.maxCombo = G.combo;
  var mult = Math.min(G.combo, 5);

  var base = 100 + Math.round(G.D * 2);
  if (wonder) { base += 150; G.wonder++; }
  var pts = base * mult;

  if (goldHit) {
    pts *= 2;
    G.goldenHits++;
    G.time += 5;
    gold.active = false;
    gold.wait = 7;
    Sound.golden();
  }
  if (Math.abs(ball.curve) > 5.5) G.banana++;
  if (G.time <= 10) G.clutch = true;

  G.score += pts;
  G.netSway = 1;
  G.shake = wonder ? 16 : 11;
  G.flash = wonder ? 0.55 : 0.35;
  ball.z = -0.45;

  var p = proj(cx, cy, 0);
  var label = 'GOAL!!';
  if (goldHit) label = 'GOLDEN GOAL!';
  else if (topCorner) label = 'TOP BIN!!';
  else if (sideNet) label = 'WONDER GOAL!';
  else if (wonder) label = 'WONDER GOAL!';

  addPopup(label, p.x, p.y - 6, goldHit ? '#ffe066' : (wonder ? '#8bf3ff' : '#c6ff45'), wonder ? 40 : 34);
  addPopup('+' + pts, p.x, p.y + 34, '#ffffff', 26);
  if (goldHit) addPopup('+5초', p.x, p.y + 68, '#ffe066', 22);
  else if (mult > 1) addPopup('x' + mult + ' COMBO', p.x, p.y + 68, '#ffb347', 20);

  burst(p.x, p.y, wonder ? 46 : 30, ['#c6ff45', '#ffffff', '#8bf3ff', '#ffe066']);
  Sound.net();
  Sound.cheer(wonder);
  if (wonder) Sound.whistle();

  endShot(0.78);
}

function resolveMiss(kind, cx, cy) {
  G.combo = 0;
  var p = proj(cx, cy, 0);
  var label = 'MISS';
  var color = '#9fb0c8';
  var big = false;

  if (kind === 'save') { label = 'SAVED!'; color = '#7fc6ff'; Sound.save(); }
  else if (kind === 'post') {
    label = 'POST!'; color = '#ffd166'; Sound.post();
    G.shake = 9; big = true;
    ball.z = -0.2;
    burst(p.x, p.y, 16, ['#ffe6a3', '#ffffff']);
  } else if (kind === 'over') { label = 'OVER THE BAR'; Sound.save(); }
  else if (kind === 'wide') { label = 'WIDE'; Sound.save(); }
  else if (kind === 'block') { label = 'BLOCKED'; color = '#ff9a9a'; Sound.post(); }

  addPopup(label, p.x, p.y - 4, color, big ? 34 : 30);
  G.shake = Math.max(G.shake, kind === 'save' ? 6 : 4);
  endShot(kind === 'post' ? 0.72 : 0.62);
}

function resolveBlock(wx, wy) {
  ball.live = false;
  ball.vx = -ball.vx * 0.35;
  ball.vz = -Math.abs(ball.vz) * 0.45;
  ball.vy = Math.abs(ball.vy) * 0.3 + 1.5;
  var p = proj(wx, wy, WALL_Z);
  burst(p.x, p.y, 12, ['#ffffff', '#dfe9ff']);
  addPopup('BLOCKED!', p.x, p.y - 10, '#ff9a9a', 28);
  G.combo = 0;
  G.shake = 7;
  Sound.save();
  endShot(0.6);
}

function endShot(delay) {
  G.state = 'result';
  G.resultTimer = delay;
}

/* ============================================================
   7. game flow
   ============================================================ */
function startGame() {
  if (G.state === 'aim' || G.state === 'flight') return;
  Sound.init();
  Sound.resume();

  G.nick = nickCurrent();
  var typed = el.nick ? nickClean(el.nick.value) : '';
  if (typed) nickRemember(typed); else RANK.myNick = G.nick;
  if (el.nick) {
    el.nick.value = G.nick;
    nickFieldSync();
    if (el.nick.blur) el.nick.blur();
  }

  G.state = 'aim';
  G.time = 60;
  G.score = 0;
  G.combo = 0;
  G.maxCombo = 0;
  G.shots = 0;
  G.goals = 0;
  G.wonder = 0;
  G.goldenHits = 0;
  G.banana = 0;
  G.clutch = false;
  G.timeUp = false;
  G.resultTimer = 0;
  G.shake = 0;
  G.netSway = 0;
  G.flash = 0;
  G.wallCount = 2;
  G.lastTickSec = 99;

  particles.length = 0;
  popups.length = 0;
  gold.active = false;
  gold.wait = 5;
  gold.life = 0;
  wind.accel = 0;

  if (el.start) el.start.classList.add('hidden');
  if (el.end) el.end.classList.add('hidden');
  if (el.hud) el.hud.classList.remove('dim');

  nextShot();
  updateHud(true);
}

function endGame() {
  G.state = 'over';
  ball.live = false;
  G.combo = 0;

  var acc = G.shots > 0 ? Math.round(G.goals / G.shots * 100) : 0;
  var grade = 'C';
  var s = G.score;
  if (s >= 9000) grade = 'S+';
  else if (s >= 6200) grade = 'S';
  else if (s >= 3800) grade = 'A';
  else if (s >= 1900) grade = 'B';

  var badges = [];
  if (G.maxCombo >= 5) badges.push('🔥 콤보 마스터');
  if (G.banana >= 2) badges.push('🍌 바나나킥 장인');
  if (G.goals >= 8) badges.push('🎯 데드볼 스페셜리스트');
  if (G.wonder >= 2) badges.push('✨ 원더골 제조기');
  if (G.clutch) badges.push('🧊 클러치 키커');
  if (G.goldenHits >= 2) badges.push('🏅 황금 타겟 헌터');

  var prevBest = G.best;
  var isNew = G.score > prevBest;
  if (isNew) {
    G.best = G.score;
    store('freekick_best', G.best);
  }

  if (el.finalScore) el.finalScore.textContent = String(G.score);
  if (el.grade) el.grade.textContent = grade;
  if (el.newBest) {
    if (isNew) el.newBest.classList.remove('hidden');
    else el.newBest.classList.add('hidden');
  }
  if (el.stats) {
    el.stats.innerHTML = '';
    var rows = [
      ['득점', G.goals + ' / ' + G.shots],
      ['성공률', acc + '%'],
      ['최고 콤보', 'x' + Math.max(1, G.maxCombo)],
      ['원더골', G.wonder + '개'],
      ['황금 타겟', G.goldenHits + '개'],
      ['최고 기록', G.best + '점']
    ];
    for (var i = 0; i < rows.length; i++) {
      var d = document.createElement('div');
      d.className = 'stat';
      d.innerHTML = '<span>' + rows[i][0] + '</span><b>' + rows[i][1] + '</b>';
      el.stats.appendChild(d);
    }
  }
  if (el.badges) {
    el.badges.innerHTML = '';
    if (badges.length === 0) {
      var n = document.createElement('span');
      n.className = 'badge none';
      n.textContent = '업적 없음 · 다음엔 콤보를 노려보세요';
      el.badges.appendChild(n);
    } else {
      for (var j = 0; j < badges.length; j++) {
        var b = document.createElement('span');
        b.className = 'badge';
        b.textContent = badges[j];
        el.badges.appendChild(b);
      }
    }
  }
  if (el.end) el.end.classList.remove('hidden');
  if (el.hud) el.hud.classList.add('dim');
  if (el.bestStart) el.bestStart.textContent = String(G.best);

  rankSubmit({ n: G.nick || nickCurrent(), s: G.score, g: G.goals, sh: G.shots, gr: grade, t: Date.now() });

  Sound.whistle();
  updateHud(true);
}

/* ============================================================
   8. input
   ============================================================ */
var drag = {
  active: false, id: null,
  sx: 0, sy: 0, dx: 0, dy: 0,
  pts: [],
  bend: 0,
  shot: null
};

function onDown(e) {
  if (e.isPrimary === false) return;
  Sound.init();
  Sound.resume();

  if (G.state === 'menu') { return; }  // start screen overlay handles taps
  if (G.state !== 'aim') return;

  var x = e.clientX, y = e.clientY;
  if (y < H * 0.30) return;

  drag.active = true;
  drag.id = e.pointerId;
  drag.sx = x;
  drag.sy = y;
  drag.dx = 0;
  drag.dy = 0;
  drag.pts = [{ x: x, y: y }];
  drag.bend = 0;
  drag.shot = null;
  if (e.cancelable) e.preventDefault();
}

function computeBend() {
  var pts = drag.pts;
  if (pts.length < 3) { drag.bend = 0; return; }
  var a = pts[0], b = pts[pts.length - 1];
  var vx = b.x - a.x, vy = b.y - a.y;
  var len = Math.sqrt(vx * vx + vy * vy);
  if (len < 22) { drag.bend = 0; return; }
  var nx = -vy / len, ny = vx / len;
  var best = 0;
  for (var i = 1; i < pts.length - 1; i++) {
    var d = (pts[i].x - a.x) * nx + (pts[i].y - a.y) * ny;
    if (Math.abs(d) > Math.abs(best)) best = d;
  }
  var bend = best / (len * 0.42);
  if (Math.abs(bend) < 0.14) bend = 0;
  drag.bend = clamp(bend, -1, 1);
}

function onMove(e) {
  if (!drag.active || e.pointerId !== drag.id) return;
  var x = e.clientX, y = e.clientY;
  var last = drag.pts[drag.pts.length - 1];
  if (!last || dist2(x, y, last.x, last.y) > 3) drag.pts.push({ x: x, y: y });
  drag.dx = x - drag.sx;
  drag.dy = y - drag.sy;
  computeBend();
  drag.shot = computeShot(drag.dx, drag.dy, drag.bend);
  if (e.cancelable) e.preventDefault();
}

function onUp(e) {
  if (!drag.active || e.pointerId !== drag.id) return;
  drag.active = false;
  drag.id = null;
  var len = Math.sqrt(drag.dx * drag.dx + drag.dy * drag.dy);
  var shot = drag.shot;
  drag.shot = null;
  if (G.state !== 'aim') return;
  if (len < 26 || !shot) return;
  if (drag.dy > -8) return;      // must drag toward the goal
  beginShot(drag.dx, drag.dy, drag.bend);
}

/* ============================================================
   9. update
   ============================================================ */
function spawnGold() {
  // keep the target on the open side, never hidden behind the wall
  var wallSide = 0;
  for (var i = 0; i < wall.length; i++) wallSide += wall[i].x;
  var side = wallSide > 0 ? -1 : 1;
  if (Math.abs(wallSide) < 0.2) side = Math.random() < 0.5 ? -1 : 1;
  gold.active = true;
  gold.x = side * rand(2.45, 3.15);
  gold.y = rand(1.35, 2.12);
  gold.life = 5.5;
  gold.pulse = 0;
}

function update(dt) {
  G.t += dt;
  G.shake = Math.max(0, G.shake - dt * 26);
  G.netSway = Math.max(0, G.netSway - dt * 1.5);
  G.flash = Math.max(0, G.flash - dt * 2.2);

  // camera glides toward the ball's lateral offset
  var camTarget = G.startX * 0.45;
  cam.camX += (camTarget - cam.camX) * Math.min(1, dt * 5.5);

  // clock (runs through aim, flight and the short result flash: 60s is 60s)
  if (G.state === 'aim' || G.state === 'flight' || G.state === 'result') {
    G.time -= dt;
    if (G.time <= 0) {
      G.time = 0;
      G.timeUp = true;
      if (G.state !== 'flight' && G.state !== 'result') { endGame(); return; }
    } else if (G.time <= 5.2) {
      var sec = Math.ceil(G.time);
      if (sec !== G.lastTickSec) { G.lastTickSec = sec; Sound.tick(); }
    }
  }

  // golden zone lifecycle
  if (G.state === 'aim' || G.state === 'flight') {
    if (gold.active) {
      gold.life -= dt;
      gold.pulse += dt;
      if (gold.life <= 0) { gold.active = false; gold.wait = rand(6, 9); }
    } else {
      gold.wait -= dt;
      if (gold.wait <= 0 && G.goals >= 1) spawnGold();
    }
  }

  // keeper
  if (keeper.active) {
    keeper.t += dt;
    var kt = keeper.t - keeper.react;
    if (kt > 0 && ball.live) {
      var dx = keeper.targetX - keeper.x;
      var step = Math.min(Math.abs(dx), keeper.speed * dt);
      keeper.x += Math.sign(dx) * step;
      keeper.dive = Math.min(1, keeper.dive + dt * 4.2);
      if (Math.abs(keeper.targetX) > 0.3) keeper.dir = Math.sign(keeper.targetX);
    }
  } else if (G.state === 'aim' || G.state === 'menu') {
    keeper.x = Math.sin(G.t * 1.1) * 0.35;
  }

  // defenders jump when the ball is coming
  if (ball.live) {
    for (var w = 0; w < wall.length; w++) {
      wall[w].jumpT = Math.min(1, wall[w].jumpT + dt * 3.4);
    }
  }

  // ball physics
  if (ball.live) updateBall(dt);

  // trail
  if (ball.live) {
    var bp = proj(ball.x, ball.y, ball.z);
    ball.trail.push({ x: bp.x, y: bp.y, r: Math.max(3, 0.11 * bp.s), life: 1 });
    if (ball.trail.length > 16) ball.trail.shift();
  }
  for (var i = ball.trail.length - 1; i >= 0; i--) {
    ball.trail[i].life -= dt * 2.4;
    if (ball.trail[i].life <= 0) ball.trail.splice(i, 1);
  }

  // particles
  for (var p = particles.length - 1; p >= 0; p--) {
    var pt = particles[p];
    pt.life -= dt;
    if (pt.life <= 0) { particles.splice(p, 1); continue; }
    pt.vy += 640 * dt;
    pt.vx *= (1 - 1.6 * dt);
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
  }

  // popups
  for (var q = popups.length - 1; q >= 0; q--) {
    var pu = popups[q];
    pu.life -= dt;
    pu.y += pu.vy * dt;
    pu.vy *= (1 - 1.2 * dt);
    if (pu.life <= 0) popups.splice(q, 1);
  }

  // result pause
  if (G.state === 'result') {
    G.resultTimer -= dt;
    if (G.resultTimer <= 0) {
      if (G.timeUp || G.time <= 0) endGame();
      else nextShot();
    }
  }

  updateHud(false);
}

function updateBall(dt) {
  var steps = Math.max(1, Math.ceil(dt / (1 / 240)));
  var h = dt / steps;

  for (var i = 0; i < steps; i++) {
    var px = ball.x, py = ball.y, pz = ball.z;

    ball.vx += (ball.curve + wind.accel) * h;
    ball.vy -= GRAV * h;
    ball.x += ball.vx * h;
    ball.y += ball.vy * h;
    ball.z += ball.vz * h;
    ball.rot += ball.spin * h * 9;

    // wall
    if (pz > WALL_Z && ball.z <= WALL_Z) {
      var den = pz - ball.z;
      var tt = den !== 0 ? (pz - WALL_Z) / den : 0;
      var wx = lerp(px, ball.x, tt);
      var wy = lerp(py, ball.y, tt);
      for (var k = 0; k < wall.length; k++) {
        var d = wall[k];
        var topY = d.top + Math.sin(d.jumpT * Math.PI) * 0.5;
        if (Math.abs(wx - d.x) < 0.42 && wy < topY && wy > -0.1) {
          ball.x = wx; ball.y = Math.max(0.11, wy); ball.z = WALL_Z;
          resolveBlock(wx, wy);
          return;
        }
      }
    }

    // goal line
    if (pz > 0 && ball.z <= 0) {
      resolveShot(px, py, pz);
      return;
    }

    // ground bounce (rolling shots)
    if (ball.y < 0.11 && ball.vy < 0) {
      ball.y = 0.11;
      ball.vy = -ball.vy * 0.42;
      ball.vx *= 0.86;
    }
  }
}

/* ============================================================
   10. hud
   ============================================================ */
var hudCache = { time: -1, score: -1, comboKey: '', windKey: '' };

function updateHud(force) {
  var tSec = Math.ceil(G.time);
  if (force || tSec !== hudCache.time) {
    hudCache.time = tSec;
    if (el.time) el.time.textContent = String(tSec);
    if (el.time) {
      if (tSec <= 10) el.time.classList.add('low');
      else el.time.classList.remove('low');
    }
  }
  if (el.bar) el.bar.style.width = clamp(G.time / 60 * 100, 0, 100).toFixed(1) + '%';

  if (force || G.score !== hudCache.score) {
    hudCache.score = G.score;
    if (el.score) el.score.textContent = String(G.score);
  }

  var ck = G.combo >= 3 ? 'fire' + Math.min(G.combo, 5) : (G.combo === 2 ? 'c2' : '');
  if (force || ck !== hudCache.comboKey) {
    hudCache.comboKey = ck;
    if (el.combo) {
      if (G.combo >= 3) {
        el.combo.textContent = '🔥 ON FIRE x' + Math.min(G.combo, 5);
        el.combo.className = 'combo on fire';
      } else if (G.combo === 2) {
        el.combo.textContent = 'x2 COMBO';
        el.combo.className = 'combo on';
      } else {
        el.combo.textContent = '';
        el.combo.className = 'combo';
      }
    }
  }

  var wk = wind.accel === 0 ? '' : (wind.accel > 0 ? 'r' : 'l') + Math.abs(wind.accel).toFixed(1);
  if (force || wk !== hudCache.windKey) {
    hudCache.windKey = wk;
    if (el.wind) {
      if (wind.accel === 0) {
        el.wind.classList.remove('on');
      } else {
        el.wind.classList.add('on');
        el.wind.textContent = wind.accel > 0
          ? '바람 ▶ ' + Math.abs(wind.accel).toFixed(1)
          : '◀ 바람 ' + Math.abs(wind.accel).toFixed(1);
      }
    }
  }
}

/* ============================================================
   11. drawing
   ============================================================ */
var skyGrad = null;
var grassGrad = null;
var crowd = [];

function buildCrowd() {
  crowd.length = 0;
  var top = cam.horizon * 0.18;
  var bot = cam.horizon * 0.99;
  var colors = ['#dfe7f3', '#ffd36e', '#7fb3ff', '#ff8a8a', '#9effc0', '#ffffff'];
  var n = Math.round(clamp(W * 0.6, 220, 900));
  for (var i = 0; i < n; i++) {
    var y = rand(top, bot);
    var p = (y - top) / Math.max(1, (bot - top));
    crowd.push({
      x: rand(-8, W + 8),
      y: y,
      r: lerp(0.6, 1.7, p),
      c: pick(colors),
      a: rand(0.18, 0.8)
    });
  }
}

function drawSky() {
  if (!skyGrad) {
    skyGrad = ctx.createLinearGradient(0, 0, 0, Math.max(10, cam.horizon * 1.05));
    skyGrad.addColorStop(0, '#03040a');
    skyGrad.addColorStop(0.55, '#080d1c');
    skyGrad.addColorStop(1, '#0d1730');
  }
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, cam.horizon + 2);
}

function drawStands() {
  // tiered seating bands behind the crowd
  var bandTop = cam.horizon * 0.16;
  var bandBot = cam.horizon;
  for (var b = 0; b < 4; b++) {
    var y0 = lerp(bandTop, bandBot, b / 4);
    var y1 = lerp(bandTop, bandBot, (b + 1) / 4);
    ctx.fillStyle = (b % 2 === 0) ? 'rgba(255,255,255,0.020)' : 'rgba(0,0,0,0.16)';
    ctx.fillRect(0, y0, W, y1 - y0);
  }

  // crowd dots
  for (var i = 0; i < crowd.length; i++) {
    var c = crowd[i];
    ctx.globalAlpha = c.a;
    ctx.fillStyle = c.c;
    ctx.fillRect(c.x, c.y, c.r, c.r);
  }
  ctx.globalAlpha = 1;

  // floodlight towers
  var towers = [[W * 0.10, cam.horizon * 0.10], [W * 0.90, cam.horizon * 0.10]];
  for (var t = 0; t < towers.length; t++) {
    var tx = towers[t][0], ty = towers[t][1];
    var g = ctx.createRadialGradient(tx, ty, 0, tx, ty, Math.max(60, W * 0.32));
    g.addColorStop(0, 'rgba(210,245,255,0.55)');
    g.addColorStop(0.25, 'rgba(150,220,255,0.16)');
    g.addColorStop(1, 'rgba(80,150,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(tx, ty, Math.max(60, W * 0.32), 0, TAU);
    ctx.fill();

    // lamp bank
    ctx.fillStyle = 'rgba(235,250,255,0.9)';
    var bw = Math.max(26, W * 0.07), bh = 5;
    for (var r = 0; r < 2; r++) {
      for (var col = 0; col < 4; col++) {
        ctx.globalAlpha = 0.65 + 0.35 * Math.sin(G.t * 2 + r + col);
        ctx.fillRect(tx - bw / 2 + col * (bw / 4), ty - 6 + r * 7, bw / 4 - 3, bh);
      }
    }
    ctx.globalAlpha = 1;
  }

  // LED ribbon along the top of the stand
  var rg = ctx.createLinearGradient(0, cam.horizon - 12, 0, cam.horizon + 2);
  rg.addColorStop(0, 'rgba(120,200,255,0)');
  rg.addColorStop(0.55, 'rgba(130,210,255,0.20)');
  rg.addColorStop(1, 'rgba(120,200,255,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(0, cam.horizon - 12, W, 14);

  // light haze over the pitch
  var hz = ctx.createLinearGradient(0, cam.horizon * 0.4, 0, cam.horizon * 1.5);
  hz.addColorStop(0, 'rgba(120,190,255,0.10)');
  hz.addColorStop(1, 'rgba(120,190,255,0)');
  ctx.fillStyle = hz;
  ctx.fillRect(0, cam.horizon * 0.4, W, cam.horizon * 1.1);
}

function drawPitch() {
  if (!grassGrad) {
    grassGrad = ctx.createLinearGradient(0, cam.horizon, 0, H);
    grassGrad.addColorStop(0, '#0a2b18');
    grassGrad.addColorStop(0.35, '#0f3d22');
    grassGrad.addColorStop(1, '#196f39');
  }
  ctx.fillStyle = grassGrad;
  ctx.fillRect(0, cam.horizon, W, H - cam.horizon);

  // mowing stripes receding in depth
  var zStart = G.D + cam.back - 3.2;
  var i = 0;
  for (var z = zStart; z > -48; z -= 4.2) {
    var z2 = z - 4.2;
    var p1 = proj(-70, 0, z), p2 = proj(70, 0, z);
    var p3 = proj(70, 0, z2), p4 = proj(-70, 0, z2);
    if (p1.y <= cam.horizon - 1) break;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.lineTo(p4.x, p4.y);
    ctx.closePath();
    ctx.fillStyle = (i % 2 === 0) ? 'rgba(255,255,255,0.042)' : 'rgba(0,0,0,0.075)';
    ctx.fill();
    i++;
  }

  // light pool in front of goal
  var gp = proj(0, 0, 8);
  var lg = ctx.createRadialGradient(gp.x, gp.y, 0, gp.x, gp.y, Math.max(160, W * 0.9));
  lg.addColorStop(0, 'rgba(190,255,190,0.10)');
  lg.addColorStop(1, 'rgba(190,255,190,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(0, cam.horizon, W, H - cam.horizon);
}

function groundLine(pts, zRef, color, widthMul) {
  var s = proj(0, 0, zRef).s;
  ctx.beginPath();
  for (var i = 0; i < pts.length; i++) {
    var q = proj(pts[i][0], 0, pts[i][1]);
    if (i === 0) ctx.moveTo(q.x, q.y);
    else ctx.lineTo(q.x, q.y);
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = clamp(s * 0.065 * (widthMul || 1), 1.2, 7);
  ctx.stroke();
}

function drawPitchLines() {
  var c = 'rgba(230,245,255,0.55)';

  // goal line
  groundLine([[-26, 0], [26, 0]], 0, c, 1.15);

  // penalty area
  groundLine([[-20.16, 0], [-20.16, 16.5], [20.16, 16.5], [20.16, 0]], 8, c, 1);
  // six yard box
  groundLine([[-9.16, 0], [-9.16, 5.5], [9.16, 5.5], [9.16, 0]], 3, c, 1);
  // penalty spot
  var ps = proj(0, 0, 11);
  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.arc(ps.x, ps.y, clamp(ps.s * 0.05, 1.2, 4), 0, TAU);
  ctx.fill();

  // penalty arc beyond the box
  var arc = [];
  for (var a = -0.94; a <= 0.94; a += 0.09) {
    arc.push([Math.sin(a) * 9.15, 11 + Math.cos(a) * 9.15]);
  }
  groundLine(arc, 16, c, 1);
}

function drawBoards() {
  var z = -8.5;
  var bl = proj(-36, 0, z), br = proj(36, 0, z);
  var tl = proj(-36, 1.0, z), tr = proj(36, 1.0, z);
  if (tl.y > cam.horizon) {
    ctx.beginPath();
    ctx.moveTo(bl.x, bl.y);
    ctx.lineTo(br.x, br.y);
    ctx.lineTo(tr.x, tr.y);
    ctx.lineTo(tl.x, tl.y);
    ctx.closePath();
    var g = ctx.createLinearGradient(0, tl.y, 0, bl.y);
    g.addColorStop(0, 'rgba(18,32,58,0.96)');
    g.addColorStop(1, 'rgba(8,14,28,0.96)');
    ctx.fillStyle = g;
    ctx.fill();

    // led dashes
    ctx.fillStyle = 'rgba(120,200,255,0.5)';
    var n = Math.round(W / 42);
    for (var i = 0; i < n; i++) {
      var x = (i + 0.5) * (W / n);
      ctx.globalAlpha = 0.25 + 0.35 * Math.abs(Math.sin(G.t * 1.6 + i * 0.6));
      ctx.fillRect(x - 8, tl.y + (bl.y - tl.y) * 0.42, 16, Math.max(1.5, (bl.y - tl.y) * 0.16));
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------------- goal ---------------- */
function drawGoalNet() {
  var sway = G.netSway;
  var wob = sway * Math.sin(G.t * 26) * 0.18;
  var back = -1.85;

  var alpha = 0.20 + sway * 0.16;
  ctx.strokeStyle = 'rgba(225,240,255,' + alpha.toFixed(3) + ')';
  ctx.lineWidth = 1;

  // back panel mesh
  ctx.beginPath();
  var xStep = 0.44, yStep = 0.34;
  for (var x = -GOAL_HW; x <= GOAL_HW + 0.001; x += xStep) {
    var a1 = proj(x + wob, 0, back);
    var a2 = proj(x + wob * 0.6, GOAL_H, back);
    ctx.moveTo(a1.x, a1.y);
    ctx.lineTo(a2.x, a2.y);
  }
  for (var y = 0; y <= GOAL_H + 0.001; y += yStep) {
    var b1 = proj(-GOAL_HW + wob, y, back);
    var b2 = proj(GOAL_HW + wob, y, back);
    ctx.moveTo(b1.x, b1.y);
    ctx.lineTo(b2.x, b2.y);
  }
  ctx.stroke();

  // side panels
  ctx.strokeStyle = 'rgba(225,240,255,' + (alpha * 0.75).toFixed(3) + ')';
  ctx.beginPath();
  for (var s = -1; s <= 1; s += 2) {
    for (var yy = 0; yy <= GOAL_H + 0.001; yy += 0.42) {
      var f = proj(s * GOAL_HW, yy, 0);
      var b = proj(s * GOAL_HW, yy * 0.92, back);
      ctx.moveTo(f.x, f.y);
      ctx.lineTo(b.x, b.y);
    }
    var fa = proj(s * GOAL_HW, GOAL_H, 0);
    var ba = proj(s * GOAL_HW, GOAL_H * 0.92, back);
    ctx.moveTo(fa.x, fa.y);
    ctx.lineTo(ba.x, ba.y);
  }
  // top panel
  for (var tx = -GOAL_HW; tx <= GOAL_HW + 0.001; tx += 0.6) {
    var t1 = proj(tx, GOAL_H, 0);
    var t2 = proj(tx, GOAL_H * 0.92, back);
    ctx.moveTo(t1.x, t1.y);
    ctx.lineTo(t2.x, t2.y);
  }
  ctx.stroke();
}

function drawGoalFrame() {
  var bl = proj(-GOAL_HW, 0, 0);
  var br = proj(GOAL_HW, 0, 0);
  var tl = proj(-GOAL_HW, GOAL_H, 0);
  var tr = proj(GOAL_HW, GOAL_H, 0);
  var w = clamp(bl.s * 0.085, 3, 14);

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // outer glow
  ctx.strokeStyle = 'rgba(190,230,255,0.20)';
  ctx.lineWidth = w * 3.2;
  ctx.beginPath();
  ctx.moveTo(bl.x, bl.y); ctx.lineTo(tl.x, tl.y);
  ctx.lineTo(tr.x, tr.y); ctx.lineTo(br.x, br.y);
  ctx.stroke();

  // solid frame
  ctx.strokeStyle = '#f2f8ff';
  ctx.lineWidth = w;
  ctx.beginPath();
  ctx.moveTo(bl.x, bl.y); ctx.lineTo(tl.x, tl.y);
  ctx.lineTo(tr.x, tr.y); ctx.lineTo(br.x, br.y);
  ctx.stroke();

  // subtle shading highlight
  ctx.strokeStyle = 'rgba(120,170,220,0.35)';
  ctx.lineWidth = Math.max(1, w * 0.3);
  ctx.beginPath();
  ctx.moveTo(bl.x + w * 0.3, bl.y); ctx.lineTo(tl.x + w * 0.3, tl.y);
  ctx.stroke();
}

function drawWindArrow() {
  if (Math.abs(wind.accel) < 0.05) return;
  if (G.state === 'menu' || G.state === 'over') return;
  var dir = wind.accel > 0 ? 1 : -1;
  var strength = Math.abs(wind.accel);
  var top = proj(0, GOAL_H, 0).y;
  var y = Math.max(cam.horizon * 0.55, top - 24);
  var cx0 = W / 2;
  var len = clamp(26 + strength * 16, 30, 74);
  var x1 = cx0 - len / 2, x2 = cx0 + len / 2;
  var a = 0.55 + 0.25 * Math.sin(G.t * 3);

  ctx.save();
  ctx.globalAlpha = a;
  ctx.strokeStyle = '#9fd8ff';
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y);
  ctx.lineTo(x2, y);
  ctx.moveTo(x2 - dir * 7, y - 5.5);
  ctx.lineTo(x2, y);
  ctx.lineTo(x2 - dir * 7, y + 5.5);
  ctx.stroke();

  ctx.fillStyle = 'rgba(190,225,255,0.9)';
  ctx.font = '800 10px system-ui,-apple-system,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('바람 ' + strength.toFixed(1), cx0, y - 9);
  ctx.restore();
}

function drawGoldZone() {
  if (!gold.active) return;
  var p = proj(gold.x, gold.y, 0);
  var s = p.s;
  var r = 0.58 * s;
  var pulse = 0.75 + 0.25 * Math.sin(gold.pulse * 7);
  var fade = clamp(gold.life / 1.2, 0, 1);

  ctx.save();
  ctx.globalAlpha = fade;
  var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 1.9);
  g.addColorStop(0, 'rgba(255,240,150,0.85)');
  g.addColorStop(0.35, 'rgba(255,205,60,0.42)');
  g.addColorStop(1, 'rgba(255,180,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(p.x, p.y, r * 1.9, 0, TAU);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,236,150,' + (0.9 * fade).toFixed(2) + ')';
  ctx.lineWidth = Math.max(1.5, r * 0.16);
  ctx.beginPath();
  ctx.arc(p.x, p.y, r * pulse, 0, TAU);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,' + (0.55 * fade).toFixed(2) + ')';
  ctx.lineWidth = Math.max(1, r * 0.08);
  ctx.beginPath();
  ctx.arc(p.x, p.y, r * 0.55, 0, TAU);
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,250,200,' + (0.95 * fade).toFixed(2) + ')';
  ctx.font = '900 ' + Math.max(9, r * 0.9) + 'px system-ui,-apple-system,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('★', p.x, p.y + r * 0.04);
  ctx.restore();
}

/* ---------------- people ---------------- */
function drawPerson(x, z, h, jump, shirt, shorts, opts) {
  opts = opts || {};
  var f = proj(x, 0, z);
  var hd = proj(x, h + jump, z);
  var s = f.s;
  var top = hd.y;
  var bot = f.y;
  var hh = bot - top;
  if (hh < 4) return;
  var w = hh * 0.23;
  var cx = f.x;

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.beginPath();
  ctx.ellipse(cx, bot + hh * 0.02, w * 0.85, w * 0.30, 0, 0, TAU);
  ctx.fill();

  // legs
  ctx.fillStyle = shorts || '#1b2b52';
  var legW = w * 0.30;
  var legTop = bot - hh * 0.42;
  ctx.fillRect(cx - w * 0.40, legTop, legW, hh * 0.42);
  ctx.fillRect(cx + w * 0.10, legTop, legW, hh * 0.42);
  // socks
  ctx.fillStyle = opts.socks || '#0f1a33';
  ctx.fillRect(cx - w * 0.40, bot - hh * 0.16, legW, hh * 0.16);
  ctx.fillRect(cx + w * 0.10, bot - hh * 0.16, legW, hh * 0.16);

  // torso
  ctx.fillStyle = shirt;
  var tw = w * 1.06;
  var tTop = bot - hh * 0.80;
  var tBot = bot - hh * 0.38;
  ctx.beginPath();
  if (ctx.roundRect) {
    ctx.roundRect(cx - tw / 2, tTop, tw, tBot - tTop, Math.max(1, w * 0.2));
  } else {
    ctx.rect(cx - tw / 2, tTop, tw, tBot - tTop);
  }
  ctx.fill();

  // arms
  ctx.strokeStyle = shirt;
  ctx.lineWidth = Math.max(1.2, w * 0.24);
  ctx.lineCap = 'round';
  var armY = tTop + (tBot - tTop) * 0.18;
  if (jump > 0.05 || opts.armsUp) {
    ctx.beginPath();
    ctx.moveTo(cx - tw / 2, armY);
    ctx.lineTo(cx - tw * 0.78, top + hh * 0.14);
    ctx.moveTo(cx + tw / 2, armY);
    ctx.lineTo(cx + tw * 0.78, top + hh * 0.14);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(cx - tw / 2, armY);
    ctx.lineTo(cx - tw * 0.72, tBot - hh * 0.02);
    ctx.moveTo(cx + tw / 2, armY);
    ctx.lineTo(cx + tw * 0.72, tBot - hh * 0.02);
    ctx.stroke();
  }

  // head
  var hr = Math.max(2, hh * 0.088);
  ctx.fillStyle = opts.skin || '#e8bb95';
  ctx.beginPath();
  ctx.arc(cx, top + hr * 0.95, hr, 0, TAU);
  ctx.fill();
  // hair
  ctx.fillStyle = opts.hair || '#2a1c15';
  ctx.beginPath();
  ctx.arc(cx, top + hr * 0.78, hr * 0.98, Math.PI * 1.02, Math.PI * 2.02);
  ctx.fill();
}

function drawWall() {
  for (var i = 0; i < wall.length; i++) {
    var d = wall[i];
    var jump = Math.sin(d.jumpT * Math.PI) * 0.5;
    drawPerson(d.x, WALL_Z, d.top, jump, d.shirt, '#101c33', { armsUp: jump > 0.04, hair: i % 2 ? '#1b1310' : '#33241a' });
  }
}

function drawKeeper() {
  var f = proj(keeper.x, 0, 0.45);
  var s = f.s;
  var hh = 1.86 * s;
  var w = hh * 0.26;

  // shadow (screen space, does not tilt with the dive)
  ctx.fillStyle = 'rgba(0,0,0,0.30)';
  ctx.beginPath();
  ctx.ellipse(f.x, f.y, w * 0.95, w * 0.30, 0, 0, TAU);
  ctx.fill();

  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(keeper.dir * keeper.dive * 1.15);

  // legs
  ctx.fillStyle = '#0f1a2e';
  ctx.fillRect(-w * 0.40, -hh * 0.42, w * 0.30, hh * 0.42);
  ctx.fillRect(w * 0.10, -hh * 0.42, w * 0.30, hh * 0.42);

  // torso (keeper kit, neon)
  ctx.fillStyle = '#38e07a';
  ctx.beginPath();
  var tw = w * 1.12;
  var tTop = -hh * 0.82, tBot = -hh * 0.38;
  if (ctx.roundRect) ctx.roundRect(-tw / 2, tTop, tw, tBot - tTop, Math.max(1, w * 0.22));
  else ctx.rect(-tw / 2, tTop, tw, tBot - tTop);
  ctx.fill();

  // arms out when diving
  ctx.strokeStyle = '#38e07a';
  ctx.lineWidth = Math.max(1.4, w * 0.26);
  ctx.lineCap = 'round';
  var ay = tTop + (tBot - tTop) * 0.25;
  var spread = keeper.dive * 0.9;
  ctx.beginPath();
  ctx.moveTo(-tw / 2, ay);
  ctx.lineTo(-tw * (0.85 + spread), ay - hh * 0.10 - keeper.dive * hh * 0.06);
  ctx.moveTo(tw / 2, ay);
  ctx.lineTo(tw * (0.85 + spread), ay - hh * 0.10 - keeper.dive * hh * 0.06);
  ctx.stroke();

  // gloves
  ctx.fillStyle = '#ffe066';
  ctx.beginPath();
  ctx.arc(-tw * (0.85 + spread), ay - hh * 0.10 - keeper.dive * hh * 0.06, Math.max(1.4, w * 0.14), 0, TAU);
  ctx.arc(tw * (0.85 + spread), ay - hh * 0.10 - keeper.dive * hh * 0.06, Math.max(1.4, w * 0.14), 0, TAU);
  ctx.fill();

  // head
  var hr = Math.max(2, hh * 0.085);
  ctx.fillStyle = '#e8bb95';
  ctx.beginPath();
  ctx.arc(0, -hh + hr, hr, 0, TAU);
  ctx.fill();
  ctx.fillStyle = '#241a14';
  ctx.beginPath();
  ctx.arc(0, -hh + hr * 0.82, hr * 0.98, Math.PI * 1.02, Math.PI * 2.02);
  ctx.fill();

  ctx.restore();
}

/* ---------------- ball ---------------- */
function drawBallEntity() {
  var p = proj(ball.x, ball.y, ball.z);
  var r = Math.max(5, 0.11 * p.s);

  // soft glow keeps the ball readable once it is far down the pitch
  if (ball.live || ball.z < WALL_Z) {
    var gl = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2.4);
    gl.addColorStop(0, 'rgba(255,255,255,0.22)');
    gl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gl;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * 2.4, 0, TAU);
    ctx.fill();
  }

  // ground shadow
  var gp = proj(ball.x, 0, ball.z);
  var sh = clamp(1 - ball.y / 7, 0.25, 1);
  ctx.fillStyle = 'rgba(0,0,0,' + (0.30 * sh).toFixed(3) + ')';
  ctx.beginPath();
  ctx.ellipse(gp.x, gp.y, r * (1.5 + ball.y * 0.25) * sh, r * 0.5 * sh, 0, 0, TAU);
  ctx.fill();

  // trail
  for (var i = 0; i < ball.trail.length; i++) {
    var tr = ball.trail[i];
    var a = (tr.life / 1) * (i / Math.max(1, ball.trail.length)) * 0.32;
    if (a <= 0.01) continue;
    ctx.fillStyle = 'rgba(190,240,255,' + a.toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(tr.x, tr.y, tr.r * (0.45 + 0.55 * tr.life), 0, TAU);
    ctx.fill();
  }

  // ball body
  var g = ctx.createRadialGradient(p.x - r * 0.35, p.y - r * 0.4, r * 0.12, p.x, p.y, r * 1.05);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(0.6, '#e8eef6');
  g.addColorStop(1, '#8f9fb5');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(p.x, p.y, r, 0, TAU);
  ctx.fill();

  // rotating panels
  ctx.save();
  ctx.beginPath();
  ctx.arc(p.x, p.y, r * 0.98, 0, TAU);
  ctx.clip();
  ctx.fillStyle = 'rgba(20,28,40,0.9)';
  for (var k = 0; k < 3; k++) {
    var ang = ball.rot + k * (TAU / 3);
    var px = p.x + Math.cos(ang) * r * 0.55;
    var py = p.y + Math.sin(ang) * r * 0.5;
    var pr = r * (0.30 + 0.10 * Math.abs(Math.cos(ang)));
    ctx.beginPath();
    ctx.arc(px, py, pr, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  // rim
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = Math.max(1, r * 0.10);
  ctx.beginPath();
  ctx.arc(p.x, p.y, r * 0.97, 0, TAU);
  ctx.stroke();

  // idle invite ring
  if (G.state === 'aim' && !drag.active) {
    var pulse = 0.5 + 0.5 * Math.sin(G.t * 3.2);
    ctx.strokeStyle = 'rgba(198,255,69,' + (0.18 + 0.25 * pulse).toFixed(3) + ')';
    ctx.lineWidth = Math.max(1, r * 0.16);
    ctx.beginPath();
    ctx.arc(p.x, p.y, r * (1.5 + 0.35 * pulse), 0, TAU);
    ctx.stroke();
  }
}

/* ---------------- aiming ---------------- */
function drawAim() {
  if (!drag.active || !drag.shot) return;
  var shot = drag.shot;
  var pts = previewPoints(shot);

  var bp = proj(ball.x, ball.y, ball.z);

  // swipe path
  if (drag.pts.length > 2) {
    ctx.strokeStyle = 'rgba(198,255,69,0.22)';
    ctx.lineWidth = Math.max(2, 8);
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (var i = 0; i < drag.pts.length; i++) {
      if (i === 0) ctx.moveTo(drag.pts[i].x, drag.pts[i].y);
      else ctx.lineTo(drag.pts[i].x, drag.pts[i].y);
    }
    ctx.stroke();
  }

  // aim ray
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([5, 7]);
  ctx.beginPath();
  ctx.moveTo(bp.x, bp.y);
  ctx.lineTo(bp.x + drag.dx * 1.8, bp.y + drag.dy * 1.8);
  ctx.stroke();
  ctx.setLineDash([]);

  // predicted trajectory dots
  for (var k = 0; k < pts.length; k++) {
    var q = pts[k];
    var f = 1 - k / pts.length;
    var rr = clamp(0.11 * q.s * 0.5, 1.4, 12) * (0.45 + 0.55 * f);
    ctx.fillStyle = 'rgba(198,255,69,' + (0.15 + 0.6 * f).toFixed(3) + ')';
    ctx.beginPath();
    ctx.arc(q.x, q.y, rr, 0, TAU);
    ctx.fill();
  }

  // target reticle on the goal plane
  var tp = proj(shot.tx, clamp(shot.ty, 0, 6), 0);
  var inMouth = Math.abs(shot.tx) < GOAL_HW && shot.ty < GOAL_H && shot.ty > 0;
  var col = inMouth ? 'rgba(198,255,69,' : 'rgba(255,110,110,';
  ctx.strokeStyle = col + '0.95)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(tp.x, tp.y, clamp(tp.s * 0.16, 6, 22), 0, TAU);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(tp.x - 5, tp.y); ctx.lineTo(tp.x + 5, tp.y);
  ctx.moveTo(tp.x, tp.y - 5); ctx.lineTo(tp.x, tp.y + 5);
  ctx.stroke();

  // power ring around the ball
  var pr = clamp(0.11 * bp.s * 1.45, 10, 38);
  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.lineWidth = Math.max(2, pr * 0.16);
  ctx.beginPath();
  ctx.arc(bp.x, bp.y, pr, 0, TAU);
  ctx.stroke();
  ctx.strokeStyle = shot.power > 0.92 ? 'rgba(255,196,90,0.95)' : 'rgba(99,241,255,0.9)';
  ctx.beginPath();
  ctx.arc(bp.x, bp.y, pr, -Math.PI / 2, -Math.PI / 2 + TAU * shot.power);
  ctx.stroke();

  // curve badge
  if (Math.abs(shot.bend) > 0.14) {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.font = '900 ' + clamp(W * 0.038, 12, 18) + 'px system-ui,-apple-system,sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(shot.bend > 0 ? '커브 ↷' : '커브 ↶', bp.x, bp.y - pr - 16);
  }
}

/* ---------------- fx ---------------- */
function drawParticles() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    var a = clamp(p.life * 1.4, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.c;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * (0.4 + p.life * 0.8), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPopups() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < popups.length; i++) {
    var p = popups[i];
    var t = 1 - p.life / p.max;
    var a = p.life > 0.35 ? 1 : clamp(p.life / 0.35, 0, 1);
    var scale = 1 + Math.max(0, 0.35 - t) * 1.2;
    if (p._w === undefined) {
      ctx.font = '900 ' + p.size + 'px system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif';
      p._w = ctx.measureText(p.text).width || 1;
    }
    var size = p.size;
    var maxW = W * 0.62;
    if (p._w > maxW) size = p.size * maxW / p._w;
    var px = clamp(p.x, W * 0.30, W * 0.70);

    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(px, p.y);
    ctx.scale(scale, scale);
    ctx.font = '900 ' + size.toFixed(1) + 'px system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif';
    ctx.lineWidth = Math.max(2, size * 0.13);
    ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.strokeText(p.text, 0, 0);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawHint() {
  if (G.state !== 'aim' || drag.active) return;
  if (G.shots > 3) return;
  var bp = proj(ball.x, ball.y, ball.z);
  var y = bp.y - clamp(0.11 * bp.s * 3.2, 46, 96);
  var a = 0.55 + 0.45 * Math.sin(G.t * 3.4);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = '#dfff9e';
  ctx.font = '900 ' + clamp(W * 0.042, 13, 19) + 'px system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('↑ 골대 쪽으로 드래그', bp.x, y);
  ctx.restore();
}

function render(time) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  var sh = G.shake;
  ctx.save();
  if (sh > 0.3) {
    ctx.translate(rand(-sh, sh) * 0.55, rand(-sh, sh) * 0.55);
  }

  drawSky();
  drawStands();
  drawPitch();
  drawBoards();
  drawPitchLines();
  drawGoalNet();
  drawGoalFrame();
  drawWindArrow();
  drawGoldZone();
  drawKeeper();

  // the ball is always drawn over the wall: losing sight of it behind a
  // defender at the decisive moment hurts far more than the depth error
  drawWall();
  drawBallEntity();

  drawAim();
  drawParticles();
  drawPopups();
  drawHint();

  ctx.restore();

  if (G.flash > 0.01) {
    ctx.fillStyle = 'rgba(255,255,255,' + (G.flash * 0.30).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  // vignette
  if (!vignette || vignetteKey !== W + 'x' + H) {
    vignette = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.35, W / 2, H * 0.55, Math.max(W, H) * 0.85);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.45)');
    vignetteKey = W + 'x' + H;
  }
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);
}

var vignette = null;
var vignetteKey = '';

/* ============================================================
   11.5 player id + shared ranking
   ------------------------------------------------------------
   Online board: restful-api.dev free public REST API (no key,
   CORS: *). Verified POST/GET/PUT from the browser. If the API
   is unreachable the board falls back to this device's records.
   No secret or token is stored in this page.
   ============================================================ */
var NICK_KEY = 'freekick_nick_v2';
var RANK_KEY = 'freekick_rank_v2';

var RANK = {
  id: 'ff808181a09d98f701a1ed2db03019a4',
  base: 'https://api.restful-api.dev/objects/',
  name: 'freekick-arcade-ranking',
  max: 50,
  entries: [],
  online: null,      // null unknown | true online | false this device only
  busy: false,
  err: '',
  lastSync: 0,
  myNick: ''
};

function nickClean(v) {
  var s = String(v == null ? '' : v).replace(/[\u0000-\u001f<>]/g, ' ').replace(/\s+/g, ' ').trim();
  if (s.length > 12) s = s.slice(0, 12);
  return s;
}
function nickCurrent() {
  var v = el.nick ? nickClean(el.nick.value) : '';
  return v || nickClean(RANK.myNick) || '무명선수';
}
function nickRemember(v) {
  RANK.myNick = v;
  store(NICK_KEY, v);
}

function rankCompare(a, b) {
  if (b.s !== a.s) return b.s - a.s;
  if (b.g !== a.g) return b.g - a.g;
  return (a.t || 0) - (b.t || 0);
}

/* keep one best row per nickname, sorted, capped */
function rankNormalize(list) {
  var map = {}, out = [], i, e, n, k;
  if (!list || !list.length) return out;
  for (i = 0; i < list.length; i++) {
    e = list[i];
    if (!e || typeof e !== 'object') continue;
    n = nickClean(e.n);
    if (!n) continue;
    var s = Math.max(0, Math.min(999999, parseInt(e.s, 10) || 0));
    var g = Math.max(0, Math.min(999, parseInt(e.g, 10) || 0));
    var sh = Math.max(0, Math.min(999, parseInt(e.sh, 10) || 0));
    var gr = String(e.gr || '').replace(/[<>]/g, '').slice(0, 3);
    var t = parseInt(e.t, 10) || 0;
    k = n.toLowerCase();
    var old = map[k];
    if (!old || s > old.s || (s === old.s && g > old.g)) {
      map[k] = { n: n, s: s, g: g, sh: sh, gr: gr, t: t || (old ? old.t : 0) };
    }
  }
  for (k in map) if (Object.prototype.hasOwnProperty.call(map, k)) out.push(map[k]);
  out.sort(rankCompare);
  return out.slice(0, RANK.max);
}

function rankLoadLocal() {
  try {
    var v = JSON.parse(load(RANK_KEY, '[]'));
    return Object.prototype.toString.call(v) === '[object Array]' ? v : [];
  } catch (e) { return []; }
}
function rankSaveLocal(list) {
  try { store(RANK_KEY, JSON.stringify(list || [])); } catch (e) { /* ignore */ }
}

function rankTimeout(ms) {
  if (typeof AbortController === 'function') {
    var c = new AbortController();
    var id = setTimeout(function () { try { c.abort(); } catch (e) { /* ignore */ } }, ms);
    return { signal: c.signal, done: function () { clearTimeout(id); } };
  }
  return { signal: null, done: function () {} };
}

function rankNetGet() {
  var t = rankTimeout(9000);
  return fetch(RANK.base + RANK.id, { method: 'GET', cache: 'no-store', signal: t.signal })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (obj) {
      t.done();
      var d = obj && obj.data;
      return (d && d.scores) ? d.scores : [];
    }, function (e) { t.done(); throw e; });
}

function rankNetPut(list) {
  var t = rankTimeout(9000);
  var body = JSON.stringify({ name: RANK.name, data: { v: 1, scores: list, updated: Date.now() } });
  return fetch(RANK.base + RANK.id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: body,
    signal: t.signal
  }).then(function (r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function (o) { t.done(); return o; }, function (e) { t.done(); throw e; });
}

function rankFetch() {
  if (RANK.busy) return;
  RANK.busy = true;
  rankRender();
  rankNetGet().then(function (remote) {
    RANK.online = true;
    RANK.err = '';
    RANK.lastSync = Date.now();
    RANK.entries = rankNormalize(rankNormalize(remote).concat(RANK.entries, rankLoadLocal()));
    rankSaveLocal(RANK.entries);
  }, function (e) {
    RANK.online = false;
    RANK.err = String((e && e.message) || e);
  }).then(function () {
    RANK.busy = false;
    rankRender();
  });
}

function rankSubmit(entry) {
  var mine = rankNormalize([entry])[0];
  if (!mine) return;
  nickRemember(mine.n);
  RANK.entries = rankNormalize([mine].concat(RANK.entries, rankLoadLocal()));
  rankSaveLocal(RANK.entries);
  rankRender();
  rankPush(0);
}

function rankPush(attempt) {
  RANK.busy = true;
  rankRender();
  rankNetGet().then(function (remote) {
    var list = rankNormalize((remote || []).concat(RANK.entries));
    return rankNetPut(list).then(function () {
      RANK.entries = list;
      rankSaveLocal(list);
      RANK.online = true;
      RANK.err = '';
      RANK.lastSync = Date.now();
    });
  }).catch(function (e) {
    RANK.err = String((e && e.message) || e);
    if (attempt < 1) {
      setTimeout(function () { rankPush(attempt + 1); }, 1200);
      return;
    }
    RANK.online = false;
  }).then(function () {
    RANK.busy = false;
    rankRender();
  });
}

function rankIndexOf(list, nick) {
  var k = String(nick || '').toLowerCase(), i;
  for (i = 0; i < list.length; i++) {
    if (list[i].n.toLowerCase() === k) return i;
  }
  return -1;
}

function rankStateInfo() {
  if (RANK.busy) return { t: '동기화 중…', c: 'busy' };
  if (RANK.online === true) return { t: '🌐 온라인 공유', c: '' };
  if (RANK.online === false) return { t: '📱 이 기기 기록', c: 'local' };
  return { t: '불러오는 중…', c: 'busy' };
}

function rankRowEl(entry, idx) {
  var me = RANK.myNick && entry.n.toLowerCase() === RANK.myNick.toLowerCase();
  var row = document.createElement('div');
  row.className = 'rank-row' + (me ? ' me' : '') + (idx < 3 ? ' top' : '');
  if (me) row.setAttribute('aria-current', 'true');

  var pos = document.createElement('span');
  pos.className = 'pos';
  pos.textContent = idx < 3 ? ['🥇', '🥈', '🥉'][idx] : String(idx + 1);

  var nm = document.createElement('span');
  nm.className = 'nm';
  nm.textContent = entry.n + (me ? ' (나)' : '');

  var sc = document.createElement('span');
  sc.className = 'sc';
  sc.textContent = String(entry.s);

  var gl = document.createElement('span');
  gl.className = 'gl';
  gl.textContent = (entry.g || 0) + '골';

  var gr = document.createElement('span');
  gr.className = 'gr';
  gr.textContent = entry.gr || '-';

  row.appendChild(pos); row.appendChild(nm); row.appendChild(sc); row.appendChild(gl); row.appendChild(gr);
  return row;
}

function rankBuildPanel(panel) {
  if (!panel) return;
  while (panel.firstChild) panel.removeChild(panel.firstChild);

  var head = document.createElement('div');
  head.className = 'rank-head';
  var ttl = document.createElement('span');
  ttl.textContent = '🏆 랭킹 보드';
  var st = rankStateInfo();
  var state = document.createElement('span');
  state.className = 'rank-state' + (st.c ? ' ' + st.c : '');
  state.textContent = st.t;
  var grow = document.createElement('span');
  grow.className = 'grow';
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'rank-refresh';
  btn.textContent = '↻';
  btn.title = '랭킹 새로고침';
  btn.setAttribute('aria-label', '랭킹 새로고침');
  btn.addEventListener('click', function (e) {
    e.preventDefault(); e.stopPropagation();
    rankFetch();
  });
  head.appendChild(ttl); head.appendChild(grow); head.appendChild(state); head.appendChild(btn);
  panel.appendChild(head);

  if (!RANK.entries.length) {
    var empty = document.createElement('div');
    empty.className = 'rank-empty';
    empty.textContent = '아직 기록이 없습니다. 첫 골을 넣고 1위를 차지하세요!';
    panel.appendChild(empty);
  } else {
    var cols = document.createElement('div');
    cols.className = 'rank-cols';
    ['#', '아이디', '점수', '득점', '등급'].forEach(function (t, i) {
      var c = document.createElement(i ? 'i' : 'span');
      c.textContent = t;
      cols.appendChild(c);
    });
    panel.appendChild(cols);

    var rows = document.createElement('div');
    rows.className = 'rank-rows';
    var list = RANK.entries;
    var shown = Math.min(list.length, 10);
    for (var i = 0; i < shown; i++) rows.appendChild(rankRowEl(list[i], i));
    var mine = RANK.myNick ? rankIndexOf(list, RANK.myNick) : -1;
    if (mine >= 10) {
      var gap = document.createElement('div');
      gap.className = 'rank-gap';
      gap.textContent = '•••';
      rows.appendChild(gap);
      rows.appendChild(rankRowEl(list[mine], mine));
    }
    panel.appendChild(rows);
  }

  var foot = document.createElement('div');
  foot.className = 'rank-foot';
  var n = RANK.entries.length;
  if (RANK.online === true) {
    foot.textContent = '전체 ' + n + '명 · 친구 폰에서도 같은 순위로 보입니다';
  } else if (RANK.online === false) {
    foot.textContent = '이 기기 기록 ' + n + '개 · 온라인 연결 실패(' + (RANK.err || '네트워크') + ') · 기록은 폰에 저장되고 연결되면 다시 합쳐집니다';
  } else {
    foot.textContent = n ? '이 기기 기록 ' + n + '개 · 온라인 연결 중…' : '점수를 내면 랭킹에 올라갑니다';
  }
  panel.appendChild(foot);
}

function rankRender() {
  if (RANK.myNick && el.nick && nickClean(el.nick.value) && nickClean(el.nick.value) !== RANK.myNick) {
    RANK.myNick = nickClean(el.nick.value);
  }
  rankBuildPanel(el.rankStart);
  rankBuildPanel(el.rankEnd);

  if (!el.myRank) return;
  var list = RANK.entries;
  var nick = RANK.myNick || nickCurrent();
  var idx = rankIndexOf(list, nick);
  while (el.myRank.firstChild) el.myRank.removeChild(el.myRank.firstChild);
  if (G.state !== 'over' || idx < 0) {
    el.myRank.classList.add('hidden');
    return;
  }
  el.myRank.classList.remove('hidden');
  var lbl = document.createElement('span');
  lbl.textContent = '내 순위';
  var b = document.createElement('b');
  b.textContent = (idx + 1) + '위';
  var sub = document.createElement('span');
  sub.className = 'sub2';
  sub.textContent = '/ ' + list.length + '명' + (RANK.busy ? ' · 동기화 중…' : (RANK.online === false ? ' · 기기 기록' : ''));
  el.myRank.appendChild(lbl); el.myRank.appendChild(b); el.myRank.appendChild(sub);
}

/* ---------- nickname field ---------- */
function nickFieldSync() {
  if (!el.nick) return;
  if (el.nickCount) el.nickCount.textContent = nickClean(el.nick.value).length + '/12';
}

/* ---------- toast ---------- */
var toastTimer = 0;
function toast(msg) {
  if (!el.toast) return;
  el.toast.textContent = msg;
  el.toast.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.toast.classList.remove('on'); }, 2000);
}

/* ---------- challenge link (?challenger=..&score=..) ---------- */
function readChallenge() {
  try {
    var q = new URLSearchParams(window.location.search || '');
    var n = nickClean(q.get('challenger') || '');
    var s = parseInt(q.get('score'), 10);
    if (!n || !isFinite(s) || s < 0) return null;
    return { n: n, s: Math.min(s, 999999) };
  } catch (e) { return null; }
}

function showChallenge(c) {
  if (!el.challenge || !c) return;
  while (el.challenge.firstChild) el.challenge.removeChild(el.challenge.firstChild);
  var vs = document.createElement('span');
  vs.className = 'vs';
  vs.textContent = 'CHALLENGE';
  var p = document.createElement('div');
  var who = document.createElement('b');
  who.textContent = c.n;
  p.appendChild(who);
  p.appendChild(document.createTextNode('님의 도전장 · ' + c.s + '점'));
  el.challenge.appendChild(vs);
  el.challenge.appendChild(p);
  var hint = document.createElement('div');
  hint.style.marginTop = '3px';
  hint.style.fontSize = '10px';
  hint.style.color = '#8fe3f6';
  hint.textContent = '이 점수를 넘으면 네가 위! 60초 안에 도전하세요';
  el.challenge.appendChild(hint);
  el.challenge.classList.remove('hidden');
}

function legacyCopy(txt) {
  try {
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, txt.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

function copyText(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(txt).then(function () { return true; }, function () { return legacyCopy(txt); });
  }
  return Promise.resolve(legacyCopy(txt));
}

function shareChallenge() {
  var nick = G.nick || nickCurrent();
  var url = window.location.origin + window.location.pathname +
    '?challenger=' + encodeURIComponent(nick) + '&score=' + (G.score || 0);
  copyText(url).then(function (ok) {
    if (ok) toast('도전장 링크를 복사했어요 · 친구에게 보내보세요');
    else toast('복사 실패 · 주소창 링크를 복사해 주세요');
  });
}

/* ============================================================
   12. boot
   ============================================================ */
function initMenu() {
  G.state = 'menu';
  G.wallCount = 2;
  placeBall(0, 19);
  buildWall(0, 19);
  resetKeeper();
  wind.accel = 0;
  G.time = 60;
  updateHud(true);
}

function toggleMute() {
  Sound.init();
  Sound.setMuted(!Sound.muted);
  store('freekick_muted', Sound.muted ? '1' : '0');
  if (el.mute) el.mute.textContent = Sound.muted ? '🔇' : '🔊';
}

var lastT = 0;
function frame(t) {
  if (!lastT) lastT = t;
  var dt = (t - lastT) / 1000;
  lastT = t;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  update(dt);
  render(t / 1000);
  requestAnimationFrame(frame);
}

function boot() {
  G.best = parseInt(load('freekick_best', '0'), 10) || 0;
  Sound.muted = load('freekick_muted', '0') === '1';
  if (el.mute) el.mute.textContent = Sound.muted ? '🔇' : '🔊';
  if (el.bestStart) el.bestStart.textContent = String(G.best);
  if (el.start) el.start.classList.remove('hidden');
  if (el.end) el.end.classList.add('hidden');
  if (el.hud) el.hud.classList.add('dim');

  resize();
  initMenu();

  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('orientationchange', function () { setTimeout(resize, 150); });
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', resize);
  }

  window.addEventListener('pointerdown', function (e) { Sound.init(); Sound.resume(); }, { passive: true });

  canvas.addEventListener('pointerdown', onDown, { passive: false });
  window.addEventListener('pointermove', onMove, { passive: false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  if (el.start) el.start.addEventListener('click', function (e) {
    if (e.target === el.mute) return;
    if (e.target.closest && e.target.closest('.nodismiss')) return;
    startGame();
  });
  if (el.startBtn) el.startBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    startGame();
  });
  if (el.retryBtn) el.retryBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    startGame();
  });
  if (el.shareBtn) el.shareBtn.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    shareChallenge();
  });
  if (el.rankOpenBtn) el.rankOpenBtn.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    rankFetch();
    toast('랭킹을 새로 불러오는 중…');
  });

  if (el.nick) {
    el.nick.value = nickClean(load(NICK_KEY, ''));
    nickFieldSync();
    el.nick.addEventListener('input', function () {
      nickFieldSync();
      var v = nickClean(el.nick.value);
      if (v) nickRemember(v);
      rankRender();
    });
    el.nick.addEventListener('change', function () {
      el.nick.value = nickClean(el.nick.value);
      nickFieldSync();
      nickRemember(nickCurrent());
      rankRender();
    });
    el.nick.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); el.nick.blur(); startGame(); }
    });
    ['pointerdown', 'click', 'touchstart'].forEach(function (evt) {
      el.nick.addEventListener(evt, function (e) { e.stopPropagation(); }, { passive: true });
    });
  }

  RANK.myNick = nickClean(RANK.myNick || load(NICK_KEY, ''));
  RANK.entries = rankNormalize(rankLoadLocal());
  rankRender();
  rankFetch();

  var ch = readChallenge();
  if (ch) showChallenge(ch);
  if (el.mute) el.mute.addEventListener('click', function (e) {
    e.stopPropagation();
    toggleMute();
  });

  requestAnimationFrame(frame);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

/* debug hook (used by automated checks; harmless in the browser) */
window.__FK = {
  G: G, ball: ball, cam: cam, drag: drag, keeper: keeper, wall: wall,
  gold: gold, wind: wind, popups: popups, particles: particles, Sound: Sound,
  RANK: RANK,
  startGame: startGame, endGame: endGame, nextShot: nextShot, beginShot: beginShot,
  computeShot: computeShot, proj: proj, resize: resize,
  rankRender: rankRender, rankFetch: rankFetch, rankSubmit: rankSubmit,
  rankNormalize: rankNormalize, readChallenge: readChallenge,
  setSize: function (w, h) { W = w; H = h; resize(); }
};

})();
</script>
